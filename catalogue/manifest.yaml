apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: roboshop
labels:
    project: roboshop  
    tier : backend
    component: catalogue
spec:
  replicas: 1
  selector: 
    # using these labels as selector, replicaset will manage all pods with these labels
    matchLabels:
      project: roboshop
      tier : backend
      component: catalogue
      # this is pod definition, pod is subset of replicaset, so we can use pod labels as selector
  template:
    metadata:
      labels:
        project: roboshop 
        tier : backend
        component: catalogue
    spec:
      containers:
      - name: catalogue
        image: joindevops/catalogue:1.0.0 
        envFrom:
        - configMapRef:
            name: catalogue
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier : backend
    component: catalogue
data:
  MONGO: true
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
  trainer: "Siva Kumar Reddy"
  
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue
  namespace: roboshop
  labels:
    project: roboshop
    tier : backend
    component: catalogue
spec:
  selector:
    project: roboshop
    tier : backend
    component: catalogue
  ports:
  - protocol: TCP 
    port: 8080 #service port
    targetPort: 8080 #container port
