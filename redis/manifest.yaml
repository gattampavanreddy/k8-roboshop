apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roboshop
labels:
    project: roboshop  
    tier : db
    component: redis
spec:
  replicas: 1
  selector: 
    # using these labels as selector, replicaset will manage all pods with these labels
    matchLabels:
      project: roboshop
      tier : db
      component: redis
      # this is pod definition, pod is subset of replicaset, so we can use pod labels as selector
  template:
    metadata:
      labels:
        project: roboshop 
        tier : db
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    tier : db
    component: redis
spec:
  selector:
    project: roboshop
    tier : db
    component: redis
  ports:
  - protocol: TCP 
    port: 6379 #service port
    targetPort: 6379 #container port
