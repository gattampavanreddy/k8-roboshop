apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop  
    tier : db
    component: mongodb
spec:
  replicas: 1
  selector: 
    # using these labels as selector, replicaset will manage all pods with these labels
    matchLabels:
      project: roboshop
      tier : db
      component: mongodb
      # this is pod definition, pod is subset of replicaset, so we can use pod labels as selector
  template:
    metadata:
      labels:
        project: roboshop 
        tier : db
        component: mongodb
    spec:
      containers:
      - name: mongodb
        image: gattampavan/mongodb:1.0.0 
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    tier : db
    component: mongodb
spec:
  selector:
    project: roboshop
    tier : db
    component: mongodb
  ports:
  - protocol: TCP 
    port: 27017 #service port
    targetPort: 27017 #container port
